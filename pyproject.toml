[project]
name = "qwen-finetuning"
version = "0.1.0"
description = "Fine-tune Qwen 2.5 0.5B with LoRA for instruction following"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision", 
    "torchaudio",
    "transformers>=4.40.0",
    "datasets>=2.14.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.27.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
]

[project.optional-dependencies]
logging = [
    "wandb",
    "tensorboard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configure PyTorch nightly XPU index for Intel Arc GPUs
[[tool.uv.index]]
name = "pytorch-nightly-xpu"
url = "https://download.pytorch.org/whl/nightly/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly-xpu" }
torchvision = { index = "pytorch-nightly-xpu" }
torchaudio = { index = "pytorch-nightly-xpu" }