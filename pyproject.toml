[project]
name = "qwen-finetuning"
version = "0.1.0"
description = "Fine-tune Qwen 2.5 0.5B with LoRA for instruction following"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "torchvision",
]

[project.optional-dependencies]
logging = [
    "wandb",
    "tensorboard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configure PyTorch nightly XPU index for Intel Arc GPUs
[[tool.uv.index]]
name = "pytorch-nightly-xpu"
url = "https://download.pytorch.org/whl/nightly/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly-xpu" }
torchvision = { index = "pytorch-nightly-xpu" }
torchaudio = { index = "pytorch-nightly-xpu" }
