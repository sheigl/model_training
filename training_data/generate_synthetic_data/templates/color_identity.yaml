- template_id: mono_color
  instruction: 'Generate 2 Q&A pairs for: "Can I play [card] in my mono-[color] [commander]
    deck?"


    Questions should be natural variations like:

    - "Can I play {card_name} in my mono-{color} {commander_name} deck?"

    - "Is {card_name} legal in a mono-{color} Commander deck with {commander_name}?"

    - "Does {card_name} fit in my {commander_name} deck?"


    Answers MUST:

    1. State YES or NO clearly at the start

    2. Explain Commander rule 903.4 (color identity) in plain English

    3. Check BOTH mana symbols in mana cost AND color indicator/characteristic-defining
    abilities

    4. Explain why the card''s color identity is or isn''t a subset of the commander''s

    5. Mention hybrid mana counts as both colors for color identity

    6. Be 3-5 sentences with clear reasoning

    7. Use MTG notation ({W}, {U}, {B}, {R}, {G}, {T}, etc.)'
  weight: 1.0
  validation_rules:
  - Answer states YES or NO clearly
  - Answer explains rule 903.4 / color identity rule
  - Answer checks mana cost symbols AND color indicator
  - Answer explains subset relationship (card colors ⊆ commander colors)
  - Answer mentions hybrid mana counts as both colors
  - Answer is at least 150 characters
  - Answer contains no markdown formatting
  min_answer_length: 150
  max_answer_length: 2000
- template_id: two_color
  instruction: 'Generate 2 Q&A pairs for: "Is [card] legal in my [color pair] commander
    deck?"


    Questions should be natural variations like:

    - "Is {card_name} legal in my {color_pair_name} Commander deck?"

    - "Can I run {card_name} in a {commander_name} deck?"

    - "What''s the color identity of {card_name}? Legal in {color_pair}?"


    Answers MUST:

    1. State YES or NO clearly at the start

    2. Explain BOTH colors in the commander''s color identity

    3. Check hybrid mana symbols - they count as BOTH colors for color identity

    4. Distinguish between a card''s COLOR (mana cost) vs COLOR IDENTITY (mana cost
    + rules text + color indicator)

    5. Explain the subset rule: card''s color identity must be subset of commander''s

    6. Be 3-5 sentences with clear reasoning

    7. Use MTG notation and color pair names (Azorius, Dimir, Rakdos, etc.)'
  weight: 1.0
  validation_rules:
  - Answer states YES or NO clearly
  - Answer explains both colors in commander's identity
  - Answer addresses hybrid mana counting as both colors
  - Answer distinguishes color vs color identity
  - Answer explains subset rule (card identity ⊆ commander identity)
  - Answer is at least 150 characters
  - Answer contains no markdown formatting
  min_answer_length: 150
  max_answer_length: 2000
- template_id: three_color
  instruction: 'Generate 2 Q&A pairs for: "What''s the color identity of [card]? Can
    it go in [3-color commander]?"


    Questions should be natural variations like:

    - "What''s the color identity of {card_name}? Can it go in {commander_name}?"

    - "Is {card_name} legal in my {wedge_or_shard_name} deck with {commander_name}?"

    - "Can I play {card_name} in a three-color Commander deck?"


    Answers MUST:

    1. State YES or NO clearly at the start

    2. Identify if the commander is a WEDGE (enemy pair + ally) or SHARD (ally trio)

    3. Explain off-color fetch lands: they have color identity of the colors they
    CAN fetch, not just their mana cost

    4. Check ALL mana symbols in mana cost AND rules text AND color indicator

    5. Explain the subset rule for three colors

    6. Be 3-5 sentences with clear reasoning

    7. Use wedge/shard names (Esper, Grixis, Jund, Naya, Bant, Abzan, Jeskai, Sultai,
    Mardu, Temur)'
  weight: 1.0
  validation_rules:
  - Answer states YES or NO clearly
  - Answer identifies wedge vs shard for 3-color commander
  - Answer explains off-color fetch land color identity
  - Answer checks all mana symbols (cost, text, color indicator)
  - Answer explains subset rule for three colors
  - Answer is at least 150 characters
  - Answer contains no markdown formatting
  min_answer_length: 150
  max_answer_length: 2000
- template_id: five_color
  instruction: 'Generate 2 Q&A pairs for: "Are there any color identity restrictions
    in 5-color commanders?"


    Questions should be natural variations like:

    - "Are there any color identity restrictions in 5-color commanders?"

    - "Can I play any card in my {commander_name} deck?"

    - "What cards are banned in 5-color Commander?"


    Answers MUST:

    1. Explain that 5-color commanders (WUBRG) have NO color identity restrictions
    - any card with any color identity is legal

    2. Mention The World Tree and Domain mechanics as examples of 5-color enablers

    3. Explain that the ONLY restrictions are the Commander banlist and format legality

    4. Note that cards like ''Bring to Light'', ''Converge'', ''Sunburst'' work optimally
    in 5-color

    5. Mention notable 5-color commanders (Niv-Mizzet Reborn, Jodah, Kenrith, Golos,
    Morophon)

    6. Clarify that colorless cards are always legal

    7. Be 3-5 sentences with clear reasoning'
  weight: 1.0
  validation_rules:
  - Answer explains 5-color commanders have no color identity restrictions
  - Answer mentions The World Tree and/or Domain mechanics
  - Answer mentions Commander banlist as only restriction
  - Answer mentions 5-color enablers (Converge, Sunburst, Bring to Light)
  - Answer mentions notable 5-color commanders
  - Answer clarifies colorless cards are always legal
  - Answer is at least 150 characters
  - Answer contains no markdown formatting
  min_answer_length: 150
  max_answer_length: 2000
