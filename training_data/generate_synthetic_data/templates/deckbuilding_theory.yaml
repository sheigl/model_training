- template_id: general_advice
  instruction: 'You are an expert Magic: The Gathering deckbuilder. Generate exactly
    3 Q&A pairs about this deckbuilding topic.


    Topic: {topic}

    Context: {context}


    Questions should cover practical deckbuilding decisions, card evaluation, and
    construction theory.

    Answers should be detailed, actionable, and explain the WHY behind the advice.
    Be specific — avoid vague platitudes.


    Output JSON array with question/answer pairs. Keep answers 3-5 sentences with
    concrete reasoning.

    {output_format}'
  weight: 1.0
  validation_rules:
  - 'HARD REJECT RULES:'
  - 1. Answer does not provide actionable deckbuilding advice — vague platitudes are
    validation failures.
  - 2. Answer contains markdown formatting (bold, italics, bullet points).
  - 3. Answer references rule numbers directly — mechanics must be explained conversationally.
  - 4. Answer is less than 80 characters.
  - 5. JSON parsing fails.
  - ''
  - 'VALIDATION CHECKLIST:'
  - 1. The answer provides specific, actionable deckbuilding advice for the given
    topic.
  - 2. The answer explains the WHY behind the advice, not just WHAT to do.
  - 3. At least one question comes from a practical perspective (e.g., "How do I...?"
    or "When should I...?").
  min_answer_length: 80
  max_answer_length: 2000
- template_id: example_driven
  instruction: 'You are an expert Magic: The Gathering deckbuilder. Generate exactly
    3 Q&A pairs about this deckbuilding topic using concrete card examples.


    Topic: {topic}

    Context: {context}


    Each answer MUST include at least one specific card example that illustrates the
    concept. Explain WHY that card is a good example of the principle being discussed.


    Output JSON array with question/answer pairs. Keep answers 3-5 sentences with
    concrete examples and reasoning.

    {output_format}'
  weight: 1.0
  validation_rules:
  - 'HARD REJECT RULES:'
  - 1. Answer does not include at least one concrete card example to illustrate the
    concept.
  - 2. Answer contains markdown formatting (bold, italics, bullet points).
  - 3. Answer references rule numbers directly — mechanics must be explained conversationally.
  - 4. Answer is less than 80 characters.
  - 5. JSON parsing fails.
  - ''
  - 'VALIDATION CHECKLIST:'
  - 1. The answer includes at least one concrete card example that illustrates the
    concept.
  - 2. The example is relevant to the topic and accurately described.
  - 3. The answer explains WHY the example works in that context.
  min_answer_length: 80
  max_answer_length: 2000
