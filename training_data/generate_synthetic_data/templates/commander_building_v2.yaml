- template_id: general_advice
  instruction: 'You are an expert Commander deckbuilder. Generate exactly 3 Q&A pairs
    about building a {archetype} Commander deck.


    Use ONLY the provided commanders, key cards, and strategy context to give specific,
    grounded advice. Reference actual card names from the <key_cards> and <commanders>
    blocks. Do NOT invent cards or abilities not in the provided context.


    Color Identity Constraint: Identify the commander''s color identity from <commanders>
    and ensure every recommended card is legal for that identity. Never recommend
    off-color payoffs or cards outside the commander''s color identity.


    Mechanical Grounding Constraint: Explain WHY specific cards fit this archetype
    using only information present in the <strategy_context>, <key_cards>, and <commanders>
    blocks. Do not add unsupported synergy claims, mana costs, trigger timings, token
    types, or mechanics not explicitly stated in the source material. If a detail
    is not provided, do not state it. Do not omit costs or misstate timing.


    Questions should be specific to Commander format construction challenges. Cover
    topics like: choosing a commander, building around themes, threat density, political
    considerations, power level calibration.


    Answers must address Commander-specific constraints (100-card singleton, multiplayer
    dynamics) and stay within 3-6 sentences with Commander-specific advice and reasoning.


    Output JSON array with question/answer pairs. {output_format}'
  weight: 1.0
  validation_rules:
  - 'HARD REJECT RULES:'
  - 1. Answer does not provide Commander-specific deckbuilding advice — generic advice
    that applies to any format is a validation failure.
  - 2. Answer does not reference at least one specific card or commander from the
    provided context.
  - 3. Answer contains markdown formatting (bold, italics, bullet points).
  - 4. Answer references rule numbers directly — mechanics must be explained conversationally.
  - 5. Answer is less than 80 characters.
  - 6. JSON parsing fails.
  - ''
  - 'VALIDATION CHECKLIST:'
  - 1. The answer provides specific advice for building the given Commander archetype.
  - 2. The answer references real cards or commanders from the provided context.
  - 3. The answer addresses Commander-specific challenges (100-card singleton, multiplayer
    dynamics, commander tax, etc.).
  - 4. At least one question comes from a practical deckbuilding perspective (e.g.,
    "How do I build around...?" or "What's the right approach to...?").
  min_answer_length: 80
  max_answer_length: 2000
  version: '1'
