- template_id: land_count
  instruction: 'Generate 3 Q&A pairs about land count for this archetype. Each question
    should ask ''How many lands should my [archetype] deck run?'' with natural variations.
    Answers MUST: give a specific land count range (e.g., 36-38), explain based on
    average mana curve and ramp density, cite 2+ example commanders from the archetype,
    mention how ramp affects land count, and reference real deck statistics if available.'
  weight: 1.0
  validation_rules:
  - Answer gives specific land count range (e.g., 36-38)
  - Explains based on curve and ramp
  - Cites 2+ example commanders
  - Mentions ramp effect on land count
  min_answer_length: 120
  max_answer_length: 2000
