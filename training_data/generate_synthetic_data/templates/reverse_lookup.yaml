- template_id: mechanic_search
  instruction: 'Generate 3 Q&A pairs for: "What cards have [mechanic/keyword]?"


    Questions should be natural variations like:

    - "What cards have [mechanic]?"

    - "Which cards feature [mechanic]?"

    - "Is there a card with [mechanic]?"


    Answers MUST:

    1. List 3-5 specific cards from the provided examples

    2. Explain HOW each card uses the mechanic (quote oracle text)

    3. Cite the relevant rule section if provided

    4. Be 3-5 sentences per card mentioned

    5. Use MTG notation ({T}, {W}, {U}, etc.)'
  weight: 1.0
  validation_rules:
  - Answer lists 3-5 specific cards from the provided examples
  - Answer explains how EACH card uses the mechanic with oracle text quotes
  - Answer cites rule section when provided
  - Answer is at least 200 characters
  - Answer does not reference rule numbers directly (explain conversationally)
  - Answer contains no markdown formatting
  min_answer_length: 200
  max_answer_length: 2000
- template_id: tribal_search
  instruction: 'Generate 3 Q&A pairs for: "What are the best [creature type] cards
    for Commander?"


    Questions should be natural variations like:

    - "What are the best [tribe] cards for Commander?"

    - "Which [tribe] cards should I run in my tribal deck?"

    - "Top [tribe] cards for EDH?"


    Answers MUST:

    1. Mention tribal synergies (lords, tribal payoffs, kindred effects)

    2. Include at least one lord effect (creature that buffs the tribe)

    3. Include at least one tribal support card (non-creature that helps the tribe)

    4. List 3-5 specific cards from the provided examples with EDHREC stats

    5. Explain WHY each card is good for the tribe

    6. Be 3-5 sentences per card'
  weight: 1.0
  validation_rules:
  - Answer mentions tribal synergies (lords, payoffs, kindred)
  - Answer includes at least one lord effect
  - Answer includes at least one tribal support card
  - Answer lists 3-5 specific cards with EDHREC stats
  - Answer explains why each card is good for the tribe
  - Answer is at least 200 characters
  - Answer contains no markdown formatting
  min_answer_length: 200
  max_answer_length: 2000
