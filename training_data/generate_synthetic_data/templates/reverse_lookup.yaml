- template_id: commander_search
  instruction: 'Generate 3 Q&A pairs for: "What commanders support [theme/mechanic]?"


    Questions should be natural variations like:

    - "What commanders support [theme]?"

    - "Best commanders for a [theme] deck?"

    - "Which legendary creatures work with [mechanic]?"


    Answers MUST:

    1. Check color identity of each commander

    2. Explain commander''s synergy with the theme/mechanic

    3. List 3-5 legendary creatures from the provided examples

    4. Include EDHREC deck count and salt score

    5. Explain HOW the commander enables the theme (abilities, color identity)

    6. Be 3-5 sentences per commander'
  weight: 1.0
  validation_rules:
  - Answer checks color identity of each commander
  - Answer explains commander's synergy with theme/mechanic
  - Answer lists 3-5 legendary creatures from provided examples
  - Answer includes EDHREC deck count and salt score
  - Answer explains HOW commander enables the theme
  - Answer is at least 200 characters
  - Answer contains no markdown formatting
  min_answer_length: 200
  max_answer_length: 2000
