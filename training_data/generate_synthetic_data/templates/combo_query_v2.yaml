- template_id: how_does_it_work
  instruction: 'Generate exactly 3 Q&A pairs explaining HOW this combo works.

    Focus on: the sequence of steps, what triggers what, and why the loop is infinite
    (if applicable).

    At least one question must come from the perspective of a player who has never
    seen this combo before.

    CRITICAL: Ensure strict factual accuracy regarding the combo''s final outcome.
    Do not overstate the result or claim an unsupported infinite resource (e.g., infinite
    +1/+1 counters, tokens, or mana) unless the exact sequence of steps and card interactions
    strictly prove it.'
  weight: 1.0
  validation_rules:
  - 'HARD REJECT RULES:'
  - 1. Answer does not explain the sequence of steps in the correct order — a correct
    description of individual triggers in the wrong order is a factual error.
  - 2. Answer does not explicitly name ALL required combo pieces and explain each
    one's role.
  - 3. Answer does not state the concrete outcome matching the COMBO RESULT field
    — vague phrases like "very powerful" or "wins the game" are validation failures.
  - 4. Answer does not cite or closely paraphrase oracle text when explaining why
    a trigger fires.
  - 5. Answer contains markdown formatting (bold, italics, bullet points).
  - 6. Answer references rule numbers directly — mechanics must be explained conversationally.
  - 7. Answer is less than 80 characters.
  - 8. JSON parsing fails.
  - ''
  - 'VALIDATION CHECKLIST:'
  - 1. The sequence of triggers described matches the order in the provided combo
    steps.
  - 2. The answer explicitly names ALL required combo pieces and explains each one's
    role.
  - 3. The answer states the concrete outcome matching the COMBO RESULT field.
  - 4. Oracle text is cited or closely paraphrased when explaining why a trigger fires.
  - 5. At least one question comes from the perspective of a player who has never
    seen this combo before.
  min_answer_length: 80
  max_answer_length: 2000
  version: '1'
