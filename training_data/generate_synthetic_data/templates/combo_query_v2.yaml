- template_id: what_is_the_result
  instruction: 'Generate exactly 3 Q&A pairs explaining HOW this combo works.

    Focus on: the sequence of steps, what triggers what, and why the loop is infinite
    (if applicable).

    At least one question must come from the perspective of a player who has never
    seen this combo before.

    CRITICAL: Ensure strict factual accuracy regarding the combo''s final outcome.
