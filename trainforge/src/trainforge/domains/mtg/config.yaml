domain:
  name: "mtg"
  display_name: "Magic: The Gathering"

mongodb:
  database: "synthetic_queries"
  collections:
    cards: "mtg_cards"
    articles: "mtg_articles"
    rules: "mtg_rules"
    glossary: "mtg_glossary"
    edhrec: "edhrec_data"

# Generation defaults
defaults:
  max_items_per_generator: 0  # 0 = unlimited
  validation_enabled: true
  trace_logging: true
