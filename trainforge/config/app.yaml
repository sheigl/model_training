# TrainForge - Global Application Configuration
# Environment variables can be referenced as ${VAR_NAME}

app:
  name: "TrainForge"
  version: "0.1.0"
  
mongodb:
  uri: "${MONGODB_URI:mongodb://localhost:27017/}"
  username: "${MONGODB_USER:root}"
  password: "${MONGODB_PASS:whatever}"
  auth_source: "admin"
  max_pool_size: 50
  min_pool_size: 5

# Default model configuration
models:
  # Ollama (local)
  ollama_base_url: "${OLLAMA_BASE_URL:http://127.0.0.1:11434}"
  
  # Provider API keys
  anthropic_key: "${ANTHROPIC_KEY:}"
  openai_key: "${OPENAI_API_KEY:}"

# Default models for generation and validation
defaults:
  generation_model: "qwen2.5:14b"
  validation_model: "qwen2.5:14b"
  validation_pct: 1.0
  
# Output paths (relative to project root)
paths:
  outputs: "outputs/"
  jsonl_dir: "outputs/jsonl/"
  checkpoints_dir: "outputs/checkpoints/"
