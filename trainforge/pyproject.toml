[project]
name = "trainforge"
version = "0.1.0"
description = "Generic training data generation and synthetic data web interface"
requires-python = ">=3.10"
dependencies = [
    # LLM clients
    "ollama",
    "anthropic",
    "openai",
    # Data
    "pymongo",
    "pydantic>=2.0",
    # UI
    "streamlit>=1.30",
    "plotly",
    "rich",
    # Config
    "pyyaml",
    "python-dotenv",
    # Training (optional, installed separately)
    # "unsloth",
    # "transformers",
    # "torch",
]

[project.optional-dependencies]
training = [
    "unsloth",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "bitsandbytes",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
trainforge = "trainforge.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
